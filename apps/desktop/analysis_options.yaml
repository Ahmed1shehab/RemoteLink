# Inherits the workspace configuration rather than restating it.
#
# This file was `flutter create` scaffolding that included
# `package:flutter_lints/flutter.yaml` — a package this app does not depend on
# (the pubspec declares `lints`), so the include silently failed and the app
# was analysed with none of the project's rules. The root config is the real
# one: it promotes `unawaited_futures`, `close_sinks`, `cancel_subscriptions`,
# and `invalid_use_of_protected_member` to errors, which matters more in an app
# that owns sockets and streams than anywhere else in the repository.
include: ../../analysis_options.yaml
