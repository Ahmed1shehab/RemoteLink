name: remotelink_desktop
description: RemoteLink desktop companion — the always-on service the phone controls.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  # 3.6 is the floor for pub workspaces (`resolution: workspace`).
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

# Every dependency here is one this app actually imports. Aspirational entries
# are not free: `riverpod_generator` was listed for annotations that were never
# written, and it dragged in an `analyzer` → `macros` → `_macros` chain that
# does not resolve on Dart 3.7+, where `_macros` was removed from the SDK.
dependencies:
  # DNS-SD advertising. Required because an iPhone cannot use the UDP beacon
  # without Apple's multicast entitlement, and Bonjour is explicitly exempt.
  bonsoir: ^5.1.0
  # The native open-file dialog. Same reasoning as the mobile app: Flutter
  # ships no picker, and a text field asking the user to type a path is not a
  # substitute — it was what this app had, and nobody could send a file with it.
  file_selector: ^1.0.3
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  path_provider: ^2.1.4
  rl_core: ^0.1.0
  rl_crypto: ^0.1.0
  rl_native: ^0.1.0
  rl_protocol: ^0.1.0
  rl_transport: ^0.1.0
  # tray_manager rather than system_tray: system_tray pins `uuid ^3`, which
  # collides with anything modern in the tree, and it has not been updated in
  # over a year. tray_manager is maintained by the same author as
  # window_manager, so the two stay in step.
  tray_manager: ^0.2.3
  window_manager: ^0.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # The tray icon is loaded by path at runtime, so it must be bundled. A
    # missing asset here is a launch-time crash, not a compile error.
    - assets/tray/
