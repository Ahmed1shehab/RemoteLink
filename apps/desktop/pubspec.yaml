name: remotelink_desktop
description: RemoteLink desktop companion — the always-on service the phone controls.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  launch_at_startup: ^0.3.0
  package_info_plus: ^8.0.2
  path_provider: ^2.1.4
  qr_flutter: ^4.1.0
  riverpod_annotation: ^2.3.5
  rl_core: ^0.1.0
  rl_crypto: ^0.1.0
  rl_native: ^0.1.0
  rl_protocol: ^0.1.0
  rl_transport: ^0.1.0
  system_tray: ^2.0.3
  window_manager: ^0.4.2

dev_dependencies:
  build_runner: ^2.4.11
  flutter_test:
    sdk: flutter
  lints: ^4.0.0
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
