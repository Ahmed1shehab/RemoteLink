name: remotelink_mobile
description: RemoteLink for Android and iOS — the remote itself.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  # 3.6 is the floor for pub workspaces (`resolution: workspace`).
  sdk: ">=3.6.0 <4.0.0"
  # 3.27 for Color.withValues, which replaced the deprecated withOpacity.
  flutter: ">=3.27.0"

dependencies:
  # DNS-SD browsing. The only automatic discovery an iPhone can do without the
  # multicast entitlement Apple grants by manual application.
  bonsoir: ^5.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  meta: ^1.15.0
  path_provider: ^2.1.4
  rl_core: ^0.1.0
  rl_crypto: ^0.1.0
  rl_protocol: ^0.1.0
  rl_transport: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.0.0

flutter:
  uses-material-design: true
