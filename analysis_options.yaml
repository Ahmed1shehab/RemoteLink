include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # A dropped Future in a network stack is a hung connection, so an
    # unawaited one inside an async body is an error rather than a hint.
    #
    # `discarded_futures` is deliberately NOT promoted alongside it. It fires on
    # every `onPressed: () => service.doThing()` in a Flutter widget, where the
    # fire-and-forget is the correct and intended behaviour. Promoting it would
    # train the team to sprinkle `unawaited` until the rule meant nothing, which
    # is worse than not having it.
    unawaited_futures: error
    close_sinks: error
    cancel_subscriptions: error
    invalid_use_of_protected_member: error
    invalid_use_of_visible_for_testing_member: error
    todo: warning
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/generated/**"

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - avoid_type_to_string
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - only_throw_errors
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_relative_imports
    - sort_pub_dependencies
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_await_in_return
    - unnecessary_parenthesis
    - unnecessary_statements
    - use_enums
    - use_super_parameters
