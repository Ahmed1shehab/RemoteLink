name: remotelink

packages:
  - packages/**
  - apps/**

# Melos is used as a script runner only. Dependency resolution is handled by
# native pub workspaces (see the root pubspec), so there is no `melos bootstrap`
# step — `flutter pub get` at the repository root resolves everything at once.
#
# Melos is installed globally rather than as a dev_dependency, which keeps its
# transitive dependencies out of the workspace resolution entirely:
#
#   dart pub global activate melos
#
# Every script below has a plain-shell equivalent in tool/verify.sh, so nothing
# in this repository actually requires melos to be installed.
scripts:
  analyze:
    description: Static analysis across every package.
    # --fatal-warnings but not --fatal-infos: warnings are real defects, while
    # infos are style preferences that should not be able to fail a build.
    run: melos exec -c 1 -- dart analyze --fatal-warnings .

  format:
    description: Format all Dart sources.
    run: melos exec -c 4 -- dart format --set-exit-if-changed .

  test:
    description: Run unit tests for the pure-Dart packages.
    run: melos exec -c 1 --dir-exists=test --no-flutter -- dart test --reporter expanded

  test:flutter:
    description: Run widget tests for the Flutter packages.
    run: melos exec -c 1 --dir-exists=test --flutter -- flutter test

  verify:
    description: Everything CI runs.
    run: melos run format && melos run analyze && melos run test
