name: remotelink_workspace
publish_to: none

environment:
  # Pub workspaces landed in Dart 3.6. Below that, `resolution: workspace` in
  # the member packages is not understood and every package resolves alone.
  sdk: ">=3.6.0 <4.0.0"

# Native pub workspaces: one lockfile, one .dart_tool, one resolution for the
# whole repo. `flutter pub get` at the root bootstraps everything — there is no
# separate bootstrap step and no per-package `pub get`.
workspace:
  - packages/rl_core
  - packages/rl_protocol
  - packages/rl_crypto
  - packages/rl_transport
  - packages/rl_native
  - apps/desktop
  - apps/mobile
  - tool/latency_harness

# Deliberately no dev_dependencies. Melos is used for its script runner only
# and is installed globally (`dart pub global activate melos`), which keeps its
# transitive dependencies out of the workspace resolution entirely. Tooling
# that cannot break the build is tooling that cannot block a release.
